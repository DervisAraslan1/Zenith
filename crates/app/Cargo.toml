[package]
name = "zenith-app"
description = "Zenith: a floating notch utility hub for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zenith"
path = "src/main.rs"

[features]
default = []
# Shows frame time and repaint causes in a small overlay.
debug-overlay = []

[dependencies]
eframe.workspace = true
wgpu.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
tray-icon.workspace = true
global-hotkey.workspace = true
serde.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
raw-window-handle = "0.6"
# Update checks against GitHub Releases (same TLS stack as the plugin installer).
zenith-ui.workspace = true
zenith-platform.workspace = true
zenith-modules.workspace = true

[build-dependencies]
winresource = "0.1"
